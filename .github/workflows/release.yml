name: Build Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to attach binaries to (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x64
            ext: ""
          - os: windows-latest
            target: windows
            arch: x64
            ext: ".exe"
          - os: macos-latest
            target: macos
            arch: arm64
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build binary with PyInstaller
        run: >
          pyinstaller
          --onefile
          --name merge-dashcam-${{ matrix.target }}-${{ matrix.arch }}${{ matrix.ext }}
          --distpath ./dist
          src/merge_dashcam/cli.py

      - name: Upload binary to Release
        run: |
          gh release upload "${TAG}" "./dist/merge-dashcam-${TARGET}-${ARCH}${EXT}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
