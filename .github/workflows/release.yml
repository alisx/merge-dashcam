name: Build Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to attach binaries to (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            ext: ""
            arch: x64
          - os: windows-latest
            target: windows
            ext: ".exe"
            arch: x64
          - os: macos-latest
            target: macos
            ext: ""
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build binary with PyInstaller
        run: >
          pyinstaller
          --onefile
          --name merge-dashcam${{ matrix.ext }}
          --distpath ./dist/${{ matrix.target }}
          src/merge_dashcam/cli.py

      - name: Upload binary to Release (on release publish)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ./dist/${{ matrix.target }}/merge-dashcam${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binary to Release (on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: ./dist/${{ matrix.target }}/merge-dashcam${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
